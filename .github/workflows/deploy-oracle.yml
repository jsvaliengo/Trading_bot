name: Deploy Oracle

on:
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Zerar histórico/stats do bot (preserva config; para o bot antes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches:
      - main

concurrency:
  group: deploy-oracle-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check trading_bot tests

      - name: Run mypy (typed scope)
        run: mypy trading_bot/services/telegram_commands.py

      - name: Run pytest
        run: pytest -q

  deploy:
    name: Deploy to Oracle
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start SSH agent
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OCI_SSH_KEY:-}" ]]; then
            echo "❌ Secret OCI_SSH_KEY não definido."
            exit 1
          fi
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-add "$KEY_FILE"

      - name: Add Oracle host key
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${OCI_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$OCI_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup current server code
        id: backup
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"

          # Expande ~/ para caminho absoluto.
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          BACKUP_ROOT="/home/${OCI_USER}/deploy_backups/trading_bot"
          BACKUP_DIR="${BACKUP_ROOT}/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "REMOTE_PATH='$REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "$BACKUP_DIR"
          if [[ -d "$REMOTE_PATH" ]]; then
            rsync -a --delete \
              --exclude ".git/" \
              --exclude ".venv/" \
              --exclude "venv/" \
              --exclude "__pycache__/" \
              --exclude ".pytest_cache/" \
              --exclude ".env" \
              --exclude "runtime/" \
              --exclude "deploy_backups/" \
              "$REMOTE_PATH/" "$BACKUP_DIR/"
          fi
          EOF

          echo "remote_path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "backup_dir=$BACKUP_DIR" >> "$GITHUB_OUTPUT"

      - name: Sync project files to server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"

          # Expande ~/ para caminho absoluto.
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          # Garante destino no servidor.
          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "mkdir -p '$REMOTE_PATH'"

          # Sincroniza código, preservando .env/runtime/venv do servidor.
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".venv/" \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude ".pytest_cache/" \
            --exclude ".env" \
            --exclude "runtime/" \
            --exclude "deploy_backups/" \
            -e "ssh -p $PORT" \
            ./ "$OCI_USER@$OCI_HOST:$REMOTE_PATH/"

      - name: Reset bot state (opcional)
        if: ${{ github.event.inputs.reset_state == 'true' }}
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_PATH"

          # 1) Para o bot ANTES de zerar. Senão o autosave (e o save no
          #    shutdown durante o restart) reescreve o estado com os dados
          #    antigos em memória — a corrida que fazia o reset "não pegar".
          SCREEN_NAME="bot"
          WRAPPER_PATTERN='run_bot_loop\.sh'
          BOT_PATTERN='python.*-m[[:space:]]+trading_bot\.core\.bot'

          if screen -list | grep -q "[[:space:]]${SCREEN_NAME}[[:space:]]"; then
            echo "⏸️  Enviando Ctrl+C para a sessão screen '$SCREEN_NAME'..."
            screen -S "$SCREEN_NAME" -X stuff $'\003' || true
            sleep 3
          fi
          # Mata o wrapper PRIMEIRO — senão ele relança o bot logo após o pkill.
          if pgrep -af "$WRAPPER_PATTERN" >/dev/null; then
            echo "⏹️  Encerrando wrapper de auto-restart..."
            pkill -f "$WRAPPER_PATTERN" || true
            sleep 1
          fi
          if pgrep -af "$BOT_PATTERN" >/dev/null; then
            echo "⏹️  Enviando SIGTERM ao processo do bot..."
            pkill -f "$BOT_PATTERN" || true
            sleep 2
          fi
          screen -S "$SCREEN_NAME" -X quit >/dev/null 2>&1 || true

          # 2) Zera histórico/stats preservando a config. O script faz backup
          #    atômico e RECUSA rodar se o bot ainda estiver vivo (probe de
          #    flock) — rede de segurança caso o stop acima não tenha pego.
          PYTHON_BIN="$REMOTE_PATH/.venv/bin/python"
          if [[ ! -x "$PYTHON_BIN" ]]; then
            echo "❌ Python do virtualenv não encontrado em $PYTHON_BIN"
            exit 1
          fi
          "$PYTHON_BIN" scripts/reset_bot_state.py
          EOF

      - name: Deploy on server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"

          # Expande ~/ para caminho absoluto no runner antes de enviar ao servidor.
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" \
            "REMOTE_PATH='$REMOTE_PATH' DEPLOY_SHA='${GITHUB_SHA}' DEPLOY_REF='${GITHUB_REF_NAME}' DEPLOY_ACTOR='${GITHUB_ACTOR}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$REMOTE_PATH"
          echo "Deploy path: $(pwd)"
          ls -la

          SCRIPT_PATH=""
          if [[ -f "scripts/update_server.sh" ]]; then
            SCRIPT_PATH="scripts/update_server.sh"
          elif [[ -f "update_server.sh" ]]; then
            SCRIPT_PATH="update_server.sh"
          else
            echo "❌ Não encontrei update_server.sh no diretório de deploy."
            echo "Conteúdo do diretório atual:"
            ls -la
            if [[ -d scripts ]]; then
              echo "Conteúdo de scripts/:"
              ls -la scripts
            fi
            exit 1
          fi

          chmod +x "$SCRIPT_PATH"
          DEPLOY_SHA="${DEPLOY_SHA:-local}" \
          DEPLOY_REF="${DEPLOY_REF:-manual}" \
          DEPLOY_ACTOR="${DEPLOY_ACTOR:-manual}" \
          SKIP_GIT_PULL=1 SKIP_TESTS=1 "./$SCRIPT_PATH"
          EOF

      - name: Ensure observability stack is DOWN on OCI
        # O stack Prometheus + Grafana roda apenas no Mac local; a VM OCI não
        # tem CPU/RAM sobrando para isso. Este step garante que os containers
        # sejam removidos em todo deploy, mesmo se alguém subir manualmente.
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'EOF'
          set -uo pipefail
          OBS_DIR="$REMOTE_PATH/trading_bot/observability"

          if ! command -v docker >/dev/null 2>&1; then
            echo "ℹ️ Docker não instalado. Nada a fazer."
            exit 0
          fi
          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            DC=""
          fi

          if [[ -n "$DC" && -f "$OBS_DIR/docker-compose.yml" ]]; then
            cd "$OBS_DIR"
            echo "🧹 Garantindo que o stack de observability esteja down..."
            $DC down --remove-orphans || true
          fi

          # Remove containers residuais (caso tenham sido criados fora do compose)
          for c in trading-bot-grafana trading-bot-prometheus; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
              echo "🧹 Removendo container residual: $c"
              docker rm -f "$c" || true
            fi
          done
          echo "✅ Observability desativada na VM."
          EOF

      - name: Rollback on failure
        if: failure()
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          REMOTE_PATH: ${{ steps.backup.outputs.remote_path }}
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "REMOTE_PATH='$REMOTE_PATH' BACKUP_DIR='$BACKUP_DIR' bash -s" <<'EOF'
          set -euo pipefail

          if [[ -z "${BACKUP_DIR:-}" || ! -d "$BACKUP_DIR" ]]; then
            echo "⚠️ Backup não encontrado. Pulando rollback."
            exit 0
          fi

          echo "🔄 Rollback: $BACKUP_DIR -> $REMOTE_PATH"
          mkdir -p "$REMOTE_PATH"

          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".venv/" \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude ".pytest_cache/" \
            --exclude ".env" \
            --exclude "runtime/" \
            --exclude "deploy_backups/" \
            "$BACKUP_DIR/" "$REMOTE_PATH/"

          cd "$REMOTE_PATH"
          SCRIPT_PATH=""
          if [[ -f "scripts/update_server.sh" ]]; then
            SCRIPT_PATH="scripts/update_server.sh"
          elif [[ -f "update_server.sh" ]]; then
            SCRIPT_PATH="update_server.sh"
          fi

          if [[ -n "$SCRIPT_PATH" ]]; then
            chmod +x "$SCRIPT_PATH"
            SKIP_GIT_PULL=1 SKIP_TESTS=1 "./$SCRIPT_PATH" || true
          else
            echo "⚠️ update_server.sh não encontrado após rollback."
          fi
          EOF

      - name: Collect deploy diagnostics
        if: always()
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_PATH: ${{ secrets.OCI_PATH }}
        run: |
          set -euo pipefail
          PORT="${OCI_PORT:-22}"
          REMOTE_PATH="${OCI_PATH:-/home/ubuntu/trading_bot}"
          if [[ "$REMOTE_PATH" == "~/"* ]]; then
            REMOTE_PATH="/home/${OCI_USER}/${REMOTE_PATH#~/}"
          fi

          ssh -p "$PORT" "$OCI_USER@$OCI_HOST" "REMOTE_PATH='$REMOTE_PATH' bash -s" <<'EOF'
          set -euo pipefail

          cd "$REMOTE_PATH" || exit 0
          echo "=== BOT PROCESSOS ==="
          pgrep -af "python.*-m[[:space:]]+trading_bot\\.core\\.bot" || true
          echo
          echo "=== DEPLOY INFO ==="
          if [[ -f runtime/deploy_info.json ]]; then
            cat runtime/deploy_info.json
          else
            echo "runtime/deploy_info.json não encontrado."
          fi
          echo
          echo "=== LOG (últimas 80 linhas) ==="
          if [[ -f runtime/trading_bot.prod.log ]]; then
            tail -n 80 runtime/trading_bot.prod.log
          elif [[ -f runtime/trading_bot.log ]]; then
            tail -n 80 runtime/trading_bot.log
          elif [[ -f trading_bot.log ]]; then
            tail -n 80 trading_bot.log
          else
            echo "Arquivo de log não encontrado."
          fi
          EOF

      - name: Stop SSH agent
        if: always()
        run: |
          set +e
          rm -f "$HOME/.ssh/oci_deploy_key"
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k
          fi
