global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Bot roda na VM OCI. No Mac, abra um SSH tunnel:
  #   ssh -f -N -L 9090:127.0.0.1:9090 oci-bot
  # O Prometheus (em container) alcança via host.docker.internal:9090.
  - job_name: trading_bot
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9090']
        labels:
          instance: oci
