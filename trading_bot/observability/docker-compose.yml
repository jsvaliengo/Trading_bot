# Stack LOCAL de observabilidade (roda só no Mac do dev, NÃO na VM OCI).
#
# A VM OCI não tem CPU/RAM sobrando para Prometheus + Grafana; por isso o
# scrape é feito aqui, usando um SSH tunnel que expõe o /metrics do bot
# remoto em 127.0.0.1:9090 do Mac. O deploy-oracle.yml garante que o stack
# fique down na VM.
#
# Uso:
#   # 1) abrir o tunnel (requer host "oci-bot" em ~/.ssh/config):
#   scripts/oci_metrics_tunnel.sh start
#   # 2) subir o stack:
#   cd trading_bot/observability
#   docker compose up -d
#   open http://127.0.0.1:3000   # login: admin / admin
#   open http://127.0.0.1:9091   # Prometheus UI (porta 9091 no host)
#
# Prometheus scrapa host.docker.internal:9090 → Mac 127.0.0.1:9090 →
# (SSH tunnel) → OCI 127.0.0.1:9090 (exporter do bot).
#
# Troubleshooting:
#   scripts/oci_metrics_tunnel.sh status   # verifica se o tunnel está vivo
#   scripts/oci_metrics_tunnel.sh restart  # reabre se caiu

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-bot-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: trading-bot-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana_provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana_provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/trading_bot.json:ro
      - ./grafana_dashboard_diagnostico.json:/var/lib/grafana/dashboards/trading_bot_diagnostico.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
